name: continuous-integration

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Grant Maven Wrapper execute permission
        run: chmod +x mvnw
      - name: Verify
        run: ./mvnw clean verify
      - name: Build container
        run: docker build -t activation-service-api:${{ github.sha }} .
