services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-product_authentication_api}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - activation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-provider:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./tools/mock-provider:/app:ro
    ports:
      - "127.0.0.1:${PROVIDER_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9099/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-product_authentication_api}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD in .env}
      PROVIDER_BASE_URL: http://mock-provider:9099
      JWT_ISSUER: http://mock-provider:9099
      JWT_JWK_SET_URI: http://mock-provider:9099/.well-known/jwks.json
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_healthy

volumes:
  activation-postgres-data:
