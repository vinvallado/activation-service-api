spring:
  application.name: activation-service-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:product_authentication_api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: public
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.default_schema: activation_service
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization.write-dates-as-timestamps: false
    deserialization.fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: activation-service-api
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
logging:
  structured.format.console: ${LOG_FORMAT:logstash}
activation:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://127.0.0.1:9099}
    timeout: ${PROVIDER_TIMEOUT:PT3S}
    scenario: ${PROVIDER_SCENARIO:}
  worker:
    lease: ${WORKER_LEASE:PT2M}
    max-attempts: ${WORKER_MAX_ATTEMPTS:5}
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:1000}
resilience4j:
  circuitbreaker:
    instances:
      activationProvider:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
security:
  jwt:
    issuer: ${JWT_ISSUER:http://mock-provider:9099}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://mock-provider:9099/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:activation-service-api}
  limits:
    max-body-bytes: ${MAX_BODY_BYTES:65536}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
